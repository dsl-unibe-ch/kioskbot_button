<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://www.unibe.ch/assets/css/main.min.css"
    />
    <link
      rel="stylesheet"
      href="https://www.unibe.ch/unibe_theme_portal_2022/css/web.css"
    />
    <style>
      .popup-container {
        display: none;
        width: 585px;
        max-width: 95vw;
        padding: 48px;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
        background: #fff;
        box-shadow: 0 9px 60px 0 rgba(0, 0, 0, 0.25);
        z-index: 1;
      }
      .popup-container:popover-open {
        display: flex;
        inset: unset;
        border: none;
        margin: 0;
        position: fixed;
        bottom: 95px;
        right: 38px;
      }
      @media (max-width: 600px) {
        .popup-container:popover-open {
          width: 100vw;
          max-width: 100vw;
          right: 0;
          bottom: 0;
          padding: 18px 8px 18px 8px;
        }
      }

      .popup-close-button {
        background-color: #121212;
        opacity: 0.4;
        border: none;
        height: 45px;
        width: 45px;
        position: absolute;
        top: 0;
        right: 0;
        display: block;
        svg {
          height: unset;
          width: unset;
        }
      }
      .link-button {
        display: flex;
        padding: 15px 21px;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
        background: #d6002b;
        color: #fff;
        width: fit-content;
      }
      .popup-trigger {
        z-index: 1;
        position: fixed;
        bottom: calc(12px + 48px + 12px);
        right: 12px;
        background-color: #d6002b;
        border: none;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        svg {
          stroke: #fff;
          fill: transparent;
        }
      }

      /* Speech balloon that points to the floating button */
      .popup-balloon {
        position: fixed;
        bottom: calc(
          12px + 48px + 48px + 10px + 12px
        ); /* vertically aligned with the button */
        right: 12px;
        max-width: 160px;
        color: #121212;
        padding: 12px 14px 12px 14px;
        background: #fff;
        box-shadow: 0 9px 60px 0 rgba(0, 0, 0, 0.25);
        z-index: 2; /* above trigger and popover */
        font-size: 14px;
        line-height: 1.35;
        cursor: pointer; /* clickable to open the bot */
      }
      .popup-balloon::after {
        content: "";
        position: absolute;
        right: 16px;
        bottom: -8px;
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-top: 8px solid #fff;
        border-right: 8px solid transparent;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12));
      }
      .popup-balloon .popup-close-button {
        height: 25px;
        width: 25px;
      }
      .popup-balloon .close-balloon:hover {
        color: #111;
      }
      @media (max-width: 600px) {
        /* Keep UI clean on small screens */
        .popup-balloon {
          display: none;
        }
      }
      button {
        padding: unset;
        font-size: unset;
      }
    </style>
  </head>
  <body>
    <button
      class="popup-trigger"
      aria-label="Bot öffnen"
      popovertarget="kioskbot"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-bot-message-square-icon lucide-bot-message-square"
      >
        <path d="M12 6V2H8" />
        <path d="M15 11v2" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path
          d="M20 16a2 2 0 0 1-2 2H8.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 4 20.286V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"
        />
        <path d="M9 11v2" />
      </svg>
    </button>
    <div class="popup-balloon" role="status" aria-live="polite">
      <button
        class="popup-close-button"
        aria-label="Hinweis ausblenden"
        title="Schliessen"
        type="button"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 15 15"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M1.49219 13.6948L13.6956 1.49143"
            stroke="white"
            stroke-width="1.62712"
          />
          <path
            d="M13.6953 13.6948L1.49192 1.49143"
            stroke="white"
            stroke-width="1.62712"
          />
        </svg>
      </button>
      Hallo! Haben Sie Fragen zum Inhalt dieser Webseite? Fragen Sie mich, den
      neuen Chatbot!
    </div>
    <div id="kioskbot" class="popup-container" popover>
      <div class="popup-content">
        <button
          class="popup-close-button"
          aria-label="Schliessen"
          popovertarget="kioskbot"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1.49219 13.6948L13.6956 1.49143"
              stroke="white"
              stroke-width="1.62712"
            />
            <path
              d="M13.6953 13.6948L1.49192 1.49143"
              stroke="white"
              stroke-width="1.62712"
            />
          </svg>
        </button>
        <h2>Informationskiosk der Universität Bern</h2>
        <p>
          Der neue KI-basierte Bot beantwortet gerne Ihre Fragen zum Thema
          Qualitätsmanagement
        </p>
        <a
          href="https://informationskiosk.unibe.ch/?url="
          class="link-button"
          target="_blank"
        >
          Mehr erfahren
        </a>
      </div>
    </div>
    <script>
      (function () {
        const balloon = document.querySelector(".popup-balloon");
        const trigger = document.querySelector(".popup-trigger");
        if (!balloon || !trigger) return;

        document.querySelector(".link-button").attributes.href.value +=
          encodeURIComponent(window.location.href);

        // Respect prior dismissal within the same tab/session
        const dismissed =
          sessionStorage.getItem("kioskbotBalloonDismissed") === "1";
        if (dismissed) {
          balloon.style.display = "none";
        }

        // Click anywhere on the balloon (except the close button) to open the bot
        balloon.addEventListener("click", (e) => {
          if (e.target.closest(".close-balloon")) return;
          trigger.click();
        });

        // Close button hides the balloon and remembers the choice for the session
        balloon
          .querySelector(".close-balloon")
          ?.addEventListener("click", (e) => {
            e.stopPropagation();
            balloon.style.display = "none";
            sessionStorage.setItem("kioskbotBalloonDismissed", "1");
          });

        // Once the user opens the bot, hide the tip for this session
        trigger.addEventListener("click", () => {
          balloon.style.display = "none";
          sessionStorage.setItem("kioskbotBalloonDismissed", "1");
        });
      })();
    </script>
  </body>
</html>
